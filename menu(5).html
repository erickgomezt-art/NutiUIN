<!--
================================================================================
ARCHIVO: menu.html
LENGUAJE: HTML
FUNCIÓN: Archivo de compatibilidad que redirige automáticamente a index.html.
CONEXIÓN: Usa una etiqueta <meta http-equiv="refresh"> para abrir la portada.
================================================================================
-->
<!DOCTYPE html> <!-- Indica que este archivo usa HTML5. -->
<html lang="es"> <!-- Abre el documento HTML y define el idioma español. -->
<head> <!-- Inicia la configuración interna de la página. -->
    <meta charset="UTF-8"> <!-- Permite mostrar acentos y caracteres especiales correctamente. -->
    <title>NutriUIN</title> <!-- Título que aparece en la pestaña del navegador. -->
    <meta http-equiv="refresh" content="0; url=index.html"> <!-- Redirige a la portada para respetar el orden correcto del proyecto. -->
</head> <!-- Cierra la configuración de la página. -->
<body> <!-- Inicia el contenido visible por si la redirección tarda. -->
    <p>Abriendo la portada... <a href="index.html">Haz clic aquí</a>.</p> <!-- Mensaje y enlace manual para entrar por la portada. -->
</body> <!-- Cierra el cuerpo de la página. -->
</html> <!-- Cierra el documento HTML. -->
