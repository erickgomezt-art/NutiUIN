<!--
================================================================================
ARCHIVO: mvp.html
LENGUAJE: HTML
FUNCIÓN: Contiene el formulario de la calculadora nutricional.
CONEXIONES CON OTROS ARCHIVOS:
1. Se conecta con mvp.css para el diseño visual.
2. Se conecta con login.js para calcular IMC, metabolismo y calorías.
3. Los id de los campos (nombre, edad, peso, etc.) son buscados desde login.js.
4. login.js guarda resultados en localStorage para que menus.js los lea después.
================================================================================
-->
<!DOCTYPE html> <!-- Indica que el archivo usa HTML5. -->
<html lang="es"> <!-- Abre el documento y define que el idioma es español. -->
<head> <!-- Inicia la configuración interna de la página. -->
    <meta charset="UTF-8"> <!-- Permite mostrar correctamente acentos, ñ y símbolos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace que el diseño se ajuste a celulares y computadoras. -->
    <title>Calculadora NutriUIN</title> <!-- Título que aparece en la pestaña del navegador. -->
    <!-- Logo pequeño de la pestaña del navegador -->
    
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="mvp.css"> <!-- Conecta esta página con el diseño de la calculadora. -->
</head> <!-- Cierra la configuración de la página. -->
<body> <!-- Inicia el contenido visible para el usuario. -->

    <main class="formulario"> <!-- Caja principal del formulario de cálculo. -->
        <h1>Calculadora Nutricional</h1> <!-- Título de la calculadora. -->
        <p>Primero captura tus datos. Después podrás crear un menú sin pasar tus calorías estimadas del día.</p> <!-- Explica el nuevo flujo de la página. -->

        <input type="text" id="nombre" placeholder="Nombre completo"> <!-- Campo para escribir el nombre del usuario. -->
        <input type="number" id="edad" placeholder="Edad"> <!-- Campo numérico para escribir la edad. -->

        <select id="genero"> <!-- Lista desplegable para seleccionar género usado en el cálculo. -->
            <option>Hombre</option> <!-- Opción de género hombre. -->
            <option>Mujer</option> <!-- Opción de género mujer. -->
        </select> <!-- Cierra la lista de género. -->

        <input type="number" id="peso" placeholder="Peso en kg"> <!-- Campo numérico para escribir el peso en kilogramos. -->
        <input type="number" step="0.01" id="estatura" placeholder="Estatura en metros"> <!-- Campo para escribir la estatura con decimales, por ejemplo 1.70. -->

        <select id="actividad" aria-label="Actividad física"> <!-- Lista de actividad física; el aria-label ayuda a lectores de pantalla a identificar el campo. -->
            <option value="" selected disabled>Actividad física</option> <!-- Funciona como placeholder del select: aparece primero, pero no puede elegirse como respuesta válida. -->
            <option value="1.2">Sedentario</option> <!-- Factor bajo para poca actividad física. -->
            <option value="1.375">Ligero</option> <!-- Factor para actividad ligera. -->
            <option value="1.55">Moderado</option> <!-- Factor para actividad moderada. -->
            <option value="1.75">Intenso</option> <!-- Factor para actividad intensa. -->
            <option value="1.9">Muy intenso</option> <!-- Factor para actividad muy intensa. -->
        </select> <!-- Cierra la lista de actividad física. -->

        <select id="objetivo"> <!-- Lista para indicar el objetivo del usuario. -->
            <option>Bajar de peso</option> <!-- Opción de objetivo para bajar peso. -->
            <option>Mantener peso</option> <!-- Opción de objetivo para mantener peso. -->
            <option>Subir masa muscular</option> <!-- Opción de objetivo para subir masa muscular. -->
        </select> <!-- Cierra la lista de objetivo. -->

        <button onclick="calcularIMC()">Calcular</button> <!-- Botón que ejecuta la función calcularIMC(). -->
        <a class="volver-portada" href="index.html">Volver a la portada</a> <!-- Enlace para regresar a la portada si el usuario quiere iniciar de nuevo. -->

        <div id="resultado" class="resultado"> <!-- Caja donde se escriben los resultados usando JavaScript. -->
            Aquí aparecerán los resultados. <!-- Mensaje inicial antes de hacer el cálculo. -->
        </div> <!-- Cierra la caja de resultados. -->

        <button id="botonMenu" class="boton-menu oculto" onclick="abrirMenuPersonalizado()">Crear mi menú</button> <!-- Botón oculto que aparece solamente después de calcular. -->
    </main> <!-- Cierra el formulario principal. -->

    <script src="login.js"></script> <!-- Carga las funciones necesarias para calcular el IMC y calorías. -->
</body> <!-- Cierra el cuerpo de la página. -->
</html> <!-- Cierra el documento HTML. -->
