<!DOCTYPE html>
<!-- Indica al navegador que se utilizará HTML5 -->

<html lang="es">
<!-- Etiqueta principal de la página.
     lang="es" indica que el contenido está en español -->

<head>
    <!-- Contiene configuraciones de la página -->

    <meta charset="UTF-8">
    <!-- Permite mostrar correctamente caracteres especiales
         como á, é, í, ó, ú, ñ, etc. -->

    <title>NutriUIN</title>
    <!-- Texto que aparece en la pestaña del navegador -->

    <link rel="stylesheet" href="estilos.css">
    <!-- Conecta este archivo HTML con el archivo CSS
         para aplicar estilos y diseño -->
</head>

<body>
    <!-- Todo lo que está dentro de body será visible
         para el usuario -->

    <h1>Bienvenido a NutriUIN</h1>
    <!-- Título principal de la página -->

    <p>
        Plataforma de nutrición y gastronomía
    </p>
    <!-- Pequeña descripción del sistema -->

<!--
Botón principal del sistema.

Cuando el usuario hace clic,
se ejecuta la función entrar()
que abrirá menu.html.-->

<button onclick="entrar()">
    Entrar
</button>



    <script src="login.js"></script>
    <!-- Conecta el archivo JavaScript que contiene
         la programación de la página -->

</body>

</html>
<!-- Fin del documento HTML -->
